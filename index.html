<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIKELCS</title>
<meta name="theme-color" content="#102A43">
<style>
:root{--bg:#F5F7FA;--card:#fff;--text:#102A43;--muted:#64748B;--accent:#22A06B;--line:#E2E8F0;--danger:#dc2626}
:root[data-theme="dark"]{--bg:#0B1F33;--card:#102A43;--text:#F5F7FA;--muted:#9FB3C8;--accent:#2BB67D;--line:#1F3D5C;--danger:#ff6b6b}
header{background:#102A43;color:#fff;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;border-bottom:1px solid var(--line)}
header b{font-size:20px;display:block;line-height:1.2}header small{color:#cbd5e1;font-size:13px}
.logo{width:44px;height:44px;border-radius:12px;background:#22A06B;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.card{box-shadow:0 1px 3px rgba(16,42,67,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom,0px));overflow-wrap:break-word}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:20px 0 8px;color:var(--muted);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
input,select,textarea,button{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-width:100%}
input,select,textarea{width:100%;margin-bottom:8px}
button{cursor:pointer}.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.task{display:flex;gap:10px;align-items:center}.task input{width:auto;margin:0}.task div{flex:1}
.done span{text-decoration:line-through;color:var(--muted)}.small{font-size:13px;color:var(--muted)}
code{background:var(--bg);border:1px solid var(--line);padding:1px 5px;border-radius:4px;font-family:ui-monospace,Consolas,monospace;font-size:.9em}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--accent)}
.banner{background:rgba(34,160,107,.14);color:var(--text);border-radius:14px;padding:12px 14px;margin:12px 0;font-weight:600}
.ic{width:42px;height:42px;border-radius:50%;background:rgba(34,160,107,.15);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
.hs{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.fc{min-width:165px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
.fc .top{height:72px;background:linear-gradient(135deg,#102A43,#22A06B);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700}.fc .bd{padding:10px}
#mb{display:none;background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:12px;width:42px;height:42px;font-size:20px;padding:0;flex:0 0 auto}
body.in #mb{display:block}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#dr{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:300px;background:var(--card);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .25s;z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);overflow-y:auto}
#dr .mi{display:block;width:100%;text-align:left;border:0;background:none;padding:13px 14px;border-radius:12px;font-size:16px;color:var(--text);margin-bottom:2px}
#dr .mi.on{background:rgba(34,160,107,.15);color:var(--accent);font-weight:700}
body.menu #ov{opacity:1;pointer-events:auto}body.menu #dr{transform:none}
.x{flex:0;padding:4px 10px;color:var(--danger)}
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:6px;box-shadow:0 6px 20px rgba(16,42,67,.15)}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:9px 2px;font-size:12px;border-radius:22px}nav button.on{background:var(--accent);color:#fff;font-weight:700}
.flash{min-height:160px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.chips button{white-space:nowrap}.chips .on{background:var(--accent);color:#fff;border-color:var(--accent)}

.grid{display:block}
body:not(.in) #dr{display:none}
@media (min-width:700px){
main{max-width:820px;padding:24px 24px 48px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin-bottom:0}
.hs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));overflow:visible}.fc{min-width:0}
}
@media (min-width:1024px){
#dr{transform:none!important;width:260px;z-index:5}
#ov{display:none}
#mb{display:none!important}
body.in main,body.in header{margin-left:260px}
main{max-width:980px}
.grid{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:360px){
main{padding:12px 12px 32px}
header{padding-left:12px;padding-right:12px}
header small{display:none}
.card{padding:10px}
h1{font-size:20px}
}
</style>
</head>
