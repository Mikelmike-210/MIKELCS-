function qcard(cid){var n=S.qz.filter(function(q){return q.course_id==cid&&!q.lesson_id}).length;if(!n)return'';var at=S.qa.filter(function(a){return a.course_id==cid&&!a.lesson_id}),best=at.reduce(function(m,a){return Math.max(m,Math.round(a.score*100/a.total))},0);return'<div class="card" style="display:flex;align-items:center;gap:12px"><div class="ic">?</div><div style="flex:1"><b>Practice quiz</b><div class="small">'+n+' questions'+(at.length?' · Best '+best+'% · '+at.length+' attempt'+(at.length==1?'':'s'):'')+'</div></div><button class="pri" onclick="startQ('+cid+')">Start</button></div>'}

if(S.al){var qs=el?S.qz.filter(function(q){return q.lesson_id==el.id}):[];
h+='<button onclick="S.al=null;render()">← Lessons</button><h2>'+(el?'Edit lesson':'New lesson')+'</h2><div class="card"><input id="lt" placeholder="Lesson title" value="'+esc(el?el.title:'')+'"><input id="lp" type="number" placeholder="Order (1, 2, 3...)" value="'+(el?el.position:ls.length+1)+'"><textarea id="lb" rows="14" placeholder="Lesson content">'+esc(el?el.body:'')+'</textarea><div class="small" style="margin-bottom:8px">Formatting: ## Heading, ### Subheading, - bullet, 1. numbered, **bold**, and put [code] on its own line to start a code box and [/code] to end it.</div><button class="pri" style="width:100%" onclick="saveL()">Save lesson</button>'+(el?'<button style="width:100%;margin-top:8px;color:var(--danger)" onclick="delL('+el.id+')">Delete lesson</button>':'')+'</div>';
if(el){h+='<h2>Quiz for this lesson ('+qs.length+' questions)</h2>';qs.forEach(function(q,i){h+='<div class="card" style="display:flex;gap:10px;align-items:center"><div style="flex:1"><b style="font-size:14px">'+(i+1)+'. '+esc(q.question)+'</b><div class="small">Correct answer: '+'ABCD'.charAt(q.correct-1)+'</div></div><button class="x" onclick="del(\'quiz_questions\','+q.id+')">✕</button></div>'});h+=aq()}
}else{h+='<h2>Lessons</h2>'+(ls.length?ls.map(function(l){var n=S.qz.filter(function(q){return q.lesson_id==l.id}).length;return'<div class="card" style="cursor:pointer;display:flex;align-items:center;gap:12px" onclick="S.al='+l.id+';render()"><div class="ic">'+l.position+'</div><div style="flex:1"><b style="font-size:15px">'+esc(l.title)+'</b><div class="small">'+n+' quiz questions</div></div><span style="color:var(--muted)">›</span></div>'}).join(''):'<div class="card small">No lessons yet.</div>')+'<button class="pri" style="width:100%" onclick="S.al=\'new\';render()">+ Add lesson</button>'}
return h}
h='<h1>Admin</h1><h2>Courses ('+S.cat.length+')</h2>'+S.cat.map(function(c){var n=S.lessons.filter(function(l){return l.course_id==c.id}).length,q=S.qz.filter(function(x){return x.course_id==c.id}).length;return'<div class="card" style="display:flex;align-items:center;gap:12px"><div style="flex:1;cursor:pointer" onclick="S.ac='+c.id+';S.al=null;render()"><b style="font-size:15px">'+esc((c.code?c.code+' ':'')+c.name)+'</b><div class="small">'+n+' lessons · '+q+' quiz questions</div></div><button class="x" onclick="del(\'catalog_courses\','+c.id+')">✕</button></div>'}).join('')+'<h2>Add a course</h2><div class="card"><input id="ac" placeholder="Course code (optional, e.g. CSC101)"><input id="an" placeholder="Course name"><button class="pri" style="width:100%" onclick="addCatAdmin()">Add course</button></div>';
h+='<h2>Complaints ('+S.cmp.length+')</h2>'+(S.cmp.length?'':'<div class="card small">No complaints yet.</div>');
S.cmp.forEach(function(m){h+='<div class="card'+(m.resolved?' done':'')+'"><span>'+esc(m.message)+'</span><div class="small">'+esc(new Date(m.created_at).toLocaleString())+'</div><div class="row" style="margin-top:8px"><button onclick="upd(\'complaints\','+m.id+',{resolved:'+!m.resolved+'})">'+(m.resolved?'Reopen':'Mark resolved')+'</button><button class="x" style="flex:1" onclick="del(\'complaints\','+m.id+')">Delete</button></div></div>'});
return h}
function th(t){return '<div class="card task'+(t.done?' done':'')+'"><input type="checkbox" '+(t.done?'checked ':'')+'onchange="upd(\'tasks\','+t.id+',{done:'+!t.done+'})"><div><span>'+esc(t.title)+'</span><div class="small">'+esc(cname(t.course_id))+(t.due?' · due '+esc(t.due):'')+'</div></div><button class="x" onclick="del(\'tasks\','+t.id+')">✕</button></div>'}
function render(){
var h='',n='';
if(!S.ready){$('app').innerHTML='<div class="small">Loading...</div>';return}
if(!S.u){
$('app').innerHTML='<h1>Welcome</h1><div class="small">Sign in or create an account to start learning.</div><div class="card"><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password"><div class="row"><button class="pri" onclick="auth(\'in\')">Sign in</button><button onclick="auth(\'up\')">Create account</button></div></div>'+(S.msg?'<div class="small">'+esc(S.msg)+'</div>':'');
$('mb').style.display='none';return}
if(S.tab=='home'){
var up=S.tasks.filter(function(t){return!t.done}).sort(function(a,b){return(a.due||'9')<(b.due||'9')?-1:1});
var tot=S.lessons.length,dn=S.lessons.filter(function(l){return S.prog[l.id]}).length,pct=tot?Math.round(dn*100/tot):0,st=0,dc=0,wl=0;
S.cat.forEach(function(c){var p=cprog(c.id);if(p[1]){wl++;if(p[0]==p[1])dc++;else if(p[0]>0)st++}});
h='<div class="small">Hello, '+esc(S.u.email.split('@')[0])+'</div><div style="font-size:22px;font-weight:700">Welcome back!</div><input readonly placeholder="Search courses, lessons..." onclick="go(\'learn\')" style="margin-top:12px">'
+'<div class="banner">You\'re '+pct+'% through your lessons. Keep going!</div>'
+'<div class="card" style="display:flex;gap:14px;align-items:center"><svg width="72" height="72" viewBox="0 0 72 72" style="flex:0 0 auto"><circle cx="36" cy="36" r="30" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="36" cy="36" r="30" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+(188.5*pct/100)+' 188.5" transform="rotate(-90 36 36)"/><text x="36" y="41" text-anchor="middle" font-size="16" font-weight="700" fill="var(--text)">'+pct+'%</text></svg><div><b>Your Progress</b><div class="small">'+wl+' courses with lessons</div><div class="small">'+dc+' completed · '+st+' in progress</div></div></div>'
+week()+hc()
+'<h2>Featured courses</h2><div class="hs">'+S.cat.filter(function(c){return cprog(c.id)[1]}).map(function(c){var p=cprog(c.id);return'<div class="fc" onclick="S.tab=\'learn\';S.oc='+c.id+';render()"><div class="top">'+esc(c.name.charAt(0))+'</div><div class="bd"><b style="font-size:14px">'+esc(c.name)+'</b><div class="small">'+p[1]+' lessons</div><div class="bar"><i style="width:'+Math.round(p[0]*100/p[1])+'%"></i></div></div></div>'}).join('')+'</div>'
+'<h2>Upcoming</h2>'+(up.length?up.slice(0,4).map(th).join(''):'<div class="card small">Nothing due. Add tasks in My Courses.</div>')+'<button style="width:100%;margin-top:8px" onclick="go(\'cards\')">Review flashcards</button>';
}else if(S.tab=='courses'){
h='<h1>My Courses</h1>';
if(S.cat.length)h+='<h2>Pick from the course list</h2><div class="row"><select id="cc">'+S.cat.map(function(c){return'<option value="'+c.id+'">'+esc((c.code?c.code+' ':'')+c.name)+'</option>'}).join('')+'</select><button class="pri" style="flex:0" onclick="addCat()">Add</button></div>';
h+='<h2>Or add your own</h2><div class="row"><input id="cn" placeholder="New course"><button class="pri" style="flex:0" onclick="addCourse()">Add</button></div>';
h+='<h2>Add task</h2><div class="card"><select id="tc"><option value="">General</option>'+S.courses.map(function(c){return'<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('')+'</select><input id="tt" placeholder="Assignment / exam"><input id="td" type="date"><button class="pri" style="width:100%" onclick="addTask()">Add task</button></div>';
S.courses.forEach(function(c){var ts=S.tasks.filter(function(t){return t.course_id==c.id});h+='<h2>'+esc(c.name)+' <button class="x" onclick="del(\'courses\','+c.id+')">delete</button></h2>'+lb(c)+(ts.length?ts.map(th).join(''):'<div class="small">No tasks yet</div>')});
var g=S.tasks.filter(function(t){return!t.course_id});if(g.length)h+='<h2>General</h2>'+g.map(th).join('');
}else if(S.tab=='cards'){
var decks=[];S.cards.forEach(function(c){if(decks.indexOf(c.deck)<0)decks.push(c.deck)});
if(!S.deck||decks.indexOf(S.deck)<0)S.deck=decks[0]||'General';
h='<h1>Flashcards</h1>';
if(decks.length){var l=deckCards(),c=l[S.idx%l.length];
h+='<div class="chips">'+decks.map(function(d){return'<button class="'+(d==S.deck?'on':'')+'" onclick="pickDeck(this.textContent)">'+esc(d)+'</button>'}).join('')+'</div><div class="card flash" onclick="S.flip=!S.flip;render()">'+esc(S.flip?c.answer:c.question)+'</div><div class="small" style="text-align:center;margin-bottom:8px">Tap card to flip · '+l.length+' in this deck</div><div class="row"><button onclick="mark(false)">Review again</button><button class="pri" onclick="mark(true)">Got it</button></div>'}
else h+='<div class="card small">No cards yet. Add your first one below.</div>';
h+='<h2>Add card</h2><div class="card"><input id="cd" placeholder="Deck (e.g. Algorithms)" value="'+esc(S.deck)+'"><input id="cq" placeholder="Question"><input id="ca" placeholder="Answer"><button class="pri" style="width:100%" onclick="addCard()">Add card</button></div>';
}else if(S.tab=='learn'){
var oc=S.cat.find(function(c){return c.id==S.oc}),ls=S.lessons.filter(function(l){return l.course_id==S.oc}),ol=S.lessons.find(function(l){return l.id==S.ol});
if(S.qs){h=qhtml()}else if(ol){var ix=ls.findIndex(function(l){return l.id==ol.id}),nx=ls[ix+1],dn=S.prog[ol.id];
h='<button onclick="S.ol=null;render()">← Back</button><h1 style="margin-top:12px">'+esc(ol.title)+'</h1><div>'+fmt(ol.body)+'</div>'+lcard(ol)+'<button class="'+(dn?'':'pri')+'" style="width:100%;margin-top:20px" onclick="tglP('+ol.id+')">'+(dn?'✓ Completed (tap to undo)':'Mark as complete')+'</button>'+(nx?'<button style="width:100%;margin-top:8px" onclick="openL('+nx.id+')">Next lesson →</button>':'')}
else if(oc){var cp=cprog(oc.id);h='<button onclick="S.oc=null;render()">← Courses</button><div class="card" style="margin-top:12px;background:linear-gradient(135deg,#102A43,#15603f);color:#fff;border:0"><div style="font-size:22px;font-weight:700">'+esc(oc.name)+'</div><div style="color:#cbd5e1;margin-top:4px">'+cp[1]+' lessons · '+cp[0]+' completed</div><div class="bar" style="background:rgba(255,255,255,.25)"><i style="width:'+(cp[1]?Math.round(cp[0]*100/cp[1]):0)+'%;background:#4ade80"></i></div></div>'+qcard(oc.id)+'<h2>Lessons</h2>'+(ls.length?ls.map(function(l,i){var d=S.prog[l.id];return'<div class="card" style="cursor:pointer;display:flex;align-items:center;gap:12px" onclick="openL('+l.id+')"><div class="ic">'+(d?'✓':(i+1))+'</div><div style="flex:1"><b style="font-size:15px">'+esc(l.title)+'</b>'+(d?'<div style="color:var(--accent);font-size:12px;font-weight:700">COMPLETED</div>':'')+'</div><span style="color:var(--muted)">›</span></div>'}).join(''):'<div class="card small">Lessons coming soon.</div>')}
else{var f=S.lf;h='<h1>Learn</h1><input id="sq" placeholder="Search courses and lessons" oninput="filt(this.value)" style="margin-top:8px"><div class="chips">'+[['all','All'],['prog','In progress'],['done','Completed']].map(function(x){return'<button class="'+(f==x[0]?'on':'')+'" onclick="S.lf=\''+x[0]+'\';render()">'+x[1]+'</button>'}).join('')+'</div>'+S.cat.filter(function(c){var p=cprog(c.id);return f=='all'||(f=='prog'&&p[0]>0&&p[0]<p[1])||(f=='done'&&p[1]>0&&p[0]==p[1])}).map(function(c){var p=cprog(c.id),t=((c.code||'')+' '+c.name+' '+S.lessons.filter(function(l){return l.course_id==c.id}).map(function(l){return l.title}).join(' ')).toLowerCase();return'<div class="card cc" data-s="'+esc(t)+'" style="cursor:pointer;display:flex;align-items:center;gap:12px" onclick="S.oc='+c.id+';render()"><div class="ic">'+esc(c.name.charAt(0))+'</div><div style="flex:1"><b style="font-size:15px">'+esc((c.code?c.code+' ':'')+c.name)+'</b><div class="small">'+(p[1]?p[0]+' of '+p[1]+' lessons completed':'Lessons coming soon')+'</div>'+(p[1]?'<div class="bar"><i style="width:'+Math.round(p[0]*100/p[1])+'%"></i></div>':'')+'</div><div class="ic" style="background:var(--accent);color:#fff">›</div></div>'}).join('')}
}else if(S.tab=='more'){
h='<h1>More</h1><div class="small">Signed in as '+esc(S.u.email)+'</div><h2>Appearance</h2><div class="row"><button onclick="setTheme(\'light\');render()">Light</button><button onclick="setTheme(\'dark\');render()">Dark</button></div><h2>Report a problem</h2><div class="card"><textarea id="cm" rows="4" maxlength="2000" placeholder="Tell us what went wrong or what you would like improved"></textarea><button class="pri" style="width:100%" onclick="sendC()">Send</button></div><button style="width:100%;margin-top:8px" onclick="out()">Sign out</button>';
}else if(S.tab=='admin'&&S.admin){h=ahtml()}
$('app').innerHTML=h;
var tabs=[['home','Home'],['courses','My Courses'],['learn','Learn'],['cards','Cards'],['more','More']];if(S.admin)tabs.push(['admin','Admin']);
$('mb').style.display='block';var em={home:'🏠',courses:'📚',learn:'🎓',cards:'🗂️',more:'⚙️',admin:'🛠️'};
$('dr').innerHTML='<div style="padding:20px 18px;border-bottom:1px solid var(--line)"><div class="logo" style="margin-bottom:10px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg></div><b style="font-size:18px">MIKELCS</b><div class="small" style="word-break:break-all">'+esc(S.u.email)+'</div></div><div style="padding:10px">'+tabs.map(function(t){return'<button class="mi'+(S.tab==t[0]?' on':'')+'" onclick="go(\''+t[0]+'\');closeMenu()">'+em[t[0]]+'&nbsp;&nbsp;'+t[1]+'</button>'}).join('')+'</div><div style="margin-top:auto;padding:10px"><button class="mi" onclick="closeMenu();out()">↩&nbsp;&nbsp;Sign out</button></div>';
}
render();
</script>
</body>
